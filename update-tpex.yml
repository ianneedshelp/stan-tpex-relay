name: Update TPEx Relay
on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TPEx data
        run: bash fetch_tpex.sh
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          fs=list(pathlib.Path('data').glob('*.json'))
          assert fs, 'No JSON generated'
          for p in fs:
              obj=json.loads(p.read_text(encoding='utf-8-sig'))
              print(p, len(obj) if hasattr(obj,'__len__') else '?')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: update TPEx relay" && git push)
